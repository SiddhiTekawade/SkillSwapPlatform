<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SkillSwap</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/register.css">

</head>

<body>

    <!-- =========================
         TOAST NOTIFICATION
    ========================== -->

    <div id="toast" class="toast">
        Registration Successful
    </div>

    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <div class="container">

        <!-- LEFT SECTION -->

        <div class="left">

            <div class="content">

                <h1>SkillSwap</h1>

                <h2>Learn. Teach. Grow.</h2>

                <p>
                    Connect with thousands of learners and mentors.
                    Exchange skills and build your future.
                </p>

                <!-- You can replace this image later -->

                <img src="assets/images/register-illustration.svg"
                    alt="Register Illustration">

            </div>

        </div>

        <!-- RIGHT SECTION -->

        <div class="right">

            <form id="registerForm">

                <h2>Create Account</h2>

                <p>Join our growing community.</p>

                <!-- FULL NAME -->

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        required>

                </div>

                <!-- EMAIL -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>

                </div>

                <!-- PASSWORD -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <span id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

                <!-- PASSWORD STRENGTH -->

                <div class="strength">

                    <div id="strengthBar"></div>

                </div>

                <small id="strengthText">

                    Password Strength

                </small>

                <!-- CONFIRM PASSWORD -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        required>

                    <span id="toggleConfirmPassword">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

                <!-- LOCATION -->

                <div class="input-box">

                    <i class="fa-solid fa-location-dot"></i>

                    <input
                        type="text"
                        id="location"
                        placeholder="Location">

                </div>

                <!-- BIO -->

                <div class="input-box textarea">

                    <textarea
                        id="bio"
                        rows="4"
                        placeholder="Tell us about yourself..."></textarea>

                </div>

                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    id="registerBtn"
                    class="registerBtn">

                    Register

                </button>

                <!-- LOGIN LINK -->

                <div class="loginLink">

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </div>

            </form>

        </div>

    </div>

    <!-- JAVASCRIPT -->

    <script src="js/register.js"></script>

</body>

</html>
